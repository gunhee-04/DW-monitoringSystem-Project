<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>위험구역 상세보기</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 700px; }
        th, td { border: 1px solid #ccc; padding: 10px; }
        th { width: 180px; background: #f2f2f2; text-align: left; }
    </style>
</head>
<body>
<h2>위험구역 상세보기</h2>

<table>
    <tr><th>구역 ID</th><td th:text="${dto.zoneId}"></td></tr>
    <tr><th>카메라 ID</th><td th:text="${dto.cameraId}"></td></tr>
    <tr><th>구역 이름</th><td th:text="${dto.zoneName}"></td></tr>
    <tr><th>구역 타입</th><td th:text="${dto.zoneType}"></td></tr>
    <tr><th>x1</th><td th:text="${dto.x1}"></td></tr>
    <tr><th>y1</th><td th:text="${dto.y1}"></td></tr>
    <tr><th>x2</th><td th:text="${dto.x2}"></td></tr>
    <tr><th>y2</th><td th:text="${dto.y2}"></td></tr>
    <tr><th>침입 기준 시간</th><td th:text="${dto.intrusionTimeSec}"></td></tr>
    <tr><th>활성 여부</th><td th:text="${dto.isActive}"></td></tr>
</table>

<div style="margin-top: 20px;">
    <a th:href="@{/admin/zone/{id}/update(id=${dto.zoneId})}">수정</a>
    <a th:href="@{/admin/zone/{cameraId}(cameraId=${dto.cameraId})}">목록</a>
</div>

</body>
</html>
