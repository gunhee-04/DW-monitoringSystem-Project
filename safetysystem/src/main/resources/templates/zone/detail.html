<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>위험구역 상세보기</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dangerzone.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header('위험구역 상세보기')}"></div>

<div class="page-wrap narrow">
    <h2 class="page-title">위험구역 상세보기</h2>

    <div class="detail-card">
        <table class="detail-table">
            <tr><th>구역 ID</th><td th:text="${dto.zoneId}"></td></tr>
            <tr><th>카메라 ID</th><td th:text="${dto.cameraId}"></td></tr>
            <tr><th>구역 이름</th><td th:text="${dto.zoneName}"></td></tr>
            <tr><th>구역 타입</th><td th:text="${dto.zoneType}"></td></tr>
            <tr><th>x1</th><td th:text="${dto.x1}"></td></tr>
            <tr><th>y1</th><td th:text="${dto.y1}"></td></tr>
            <tr><th>x2</th><td th:text="${dto.x2}"></td></tr>
            <tr><th>y2</th><td th:text="${dto.y2}"></td></tr>
            <tr><th>침입 기준 시간</th><td th:text="${dto.intrusionTimeSec} + '초'"></td></tr>
            <tr><th>활성 여부</th><td th:text="${dto.isActive ? '활성' : '비활성'}"></td></tr>
        </table>
    </div>

    <div class="detail-actions">
        <a class="btn" th:href="@{/admin/zone/{id}/update(id=${dto.zoneId})}">수정</a>
        <a class="btn btn-secondary" th:href="@{/admin/zone/{cameraId}(cameraId=${dto.cameraId})}">목록</a>
    </div>
</div>
</body>
</html>
