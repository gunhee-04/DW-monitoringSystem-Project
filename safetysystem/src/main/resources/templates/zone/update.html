<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>위험구역 수정</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dangerzone.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header('위험구역 수정')}"></div>

<div class="page-wrap narrow">
    <h2 class="page-title">위험구역 수정</h2>

    <div class="hint-box">
        ROI 영역을 다시 드래그하면 좌표가 새로 반영됩니다.
    </div>

    <div class="roi-card">
        <div class="roi-wrap">
            <img class="roi-bg" th:src="${streamUrl}" alt="camera">
            <canvas id="roiCanvas" width="800" height="450"></canvas>
        </div>
    </div>

    <form class="form-card" th:action="@{/admin/zone/{id}/updateProc(id=${dto.zoneId})}" method="post" th:object="${dto}">
        <input type="hidden" th:field="*{cameraId}">

        <div class="global-error" th:if="${#fields.hasAnyErrors()}">
            입력값을 다시 확인하세요.
        </div>

        <div class="form-row">
            <label>구역 이름</label>
            <div>
                <input type="text" th:field="*{zoneName}">
                <div class="error" th:if="${#fields.hasErrors('zoneName')}" th:errors="*{zoneName}"></div>
            </div>
        </div>

        <div class="form-row">
            <label>구역 타입</label>
            <div>
                <select th:field="*{zoneType}">
                    <option value="">선택하세요</option>
                    <option value="DANGER">DANGER</option>
                    <option value="CROWD">CROWD</option>
                    <option value="WATCH">WATCH</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('zoneType')}" th:errors="*{zoneType}"></div>
            </div>
        </div>

        <div class="form-row">
            <label>x1</label>
            <div>
                <input type="number" th:field="*{x1}" id="x1">
                <div class="error" th:if="${#fields.hasErrors('x1')}" th:errors="*{x1}"></div>
            </div>
        </div>

        <div class="form-row">
            <label>y1</label>
            <div>
                <input type="number" th:field="*{y1}" id="y1">
                <div class="error" th:if="${#fields.hasErrors('y1')}" th:errors="*{y1}"></div>
            </div>
        </div>

        <div class="form-row">
            <label>x2</label>
            <div>
                <input type="number" th:field="*{x2}" id="x2">
                <div class="error" th:if="${#fields.hasErrors('x2')}" th:errors="*{x2}"></div>
            </div>
        </div>

        <div class="form-row">
            <label>y2</label>
            <div>
                <input type="number" th:field="*{y2}" id="y2">
                <div class="error" th:if="${#fields.hasErrors('y2')}" th:errors="*{y2}"></div>
            </div>
        </div>

        <div class="form-row">
            <label>침입 기준 시간(초)</label>
            <div>
                <input type="number" th:field="*{intrusionTimeSec}">
                <div class="error" th:if="${#fields.hasErrors('intrusionTimeSec')}" th:errors="*{intrusionTimeSec}"></div>
            </div>
        </div>

        <div class="form-row">
            <label>활성 여부</label>
            <div>
                <select th:field="*{isActive}">
                    <option value="">선택하세요</option>
                    <option th:value="true">true</option>
                    <option th:value="false">false</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('isActive')}" th:errors="*{isActive}"></div>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn" type="submit">수정</button>
            <a class="btn btn-secondary" th:href="@{/admin/zone/{cameraId}(cameraId=${dto.cameraId})}">목록</a>
        </div>
    </form>
</div>

<script>
    const canvas = document.getElementById("roiCanvas");
    const ctx = canvas.getContext("2d");

    const x1Input = document.getElementById("x1");
    const y1Input = document.getElementById("y1");
    const x2Input = document.getElementById("x2");
    const y2Input = document.getElementById("y2");

    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: Math.round(e.clientX - rect.left),
            y: Math.round(e.clientY - rect.top)
        };
    }

    function drawRect(x1, y1, x2, y2) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (x1 === "" || y1 === "" || x2 === "" || y2 === "") return;

        const left = Math.min(Number(x1), Number(x2));
        const top = Math.min(Number(y1), Number(y2));
        const width = Math.abs(Number(x2) - Number(x1));
        const height = Math.abs(Number(y2) - Number(y1));

        ctx.strokeStyle = "red";
        ctx.lineWidth = 2;
        ctx.strokeRect(left, top, width, height);

        ctx.fillStyle = "rgba(255, 0, 0, 0.15)";
        ctx.fillRect(left, top, width, height);
    }

    canvas.addEventListener("mousedown", (e) => {
        const pos = getMousePos(e);
        isDrawing = true;
        startX = pos.x;
        startY = pos.y;
        currentX = pos.x;
        currentY = pos.y;
        drawRect(startX, startY, currentX, currentY);
    });

    canvas.addEventListener("mousemove", (e) => {
        if (!isDrawing) return;
        const pos = getMousePos(e);
        currentX = pos.x;
        currentY = pos.y;
        drawRect(startX, startY, currentX, currentY);
    });

    canvas.addEventListener("mouseup", (e) => {
        if (!isDrawing) return;
        isDrawing = false;

        const pos = getMousePos(e);
        currentX = pos.x;
        currentY = pos.y;

        const left = Math.min(startX, currentX);
        const top = Math.min(startY, currentY);
        const right = Math.max(startX, currentX);
        const bottom = Math.max(startY, currentY);

        x1Input.value = left;
        y1Input.value = top;
        x2Input.value = right;
        y2Input.value = bottom;

        drawRect(left, top, right, bottom);
    });

    canvas.addEventListener("mouseleave", () => {
        if (!isDrawing) return;
        isDrawing = false;
    });

    window.addEventListener("load", () => {
        if (x1Input.value && y1Input.value && x2Input.value && y2Input.value) {
            drawRect(x1Input.value, y1Input.value, x2Input.value, y2Input.value);
        }
    });
</script>
</body>
</html>
