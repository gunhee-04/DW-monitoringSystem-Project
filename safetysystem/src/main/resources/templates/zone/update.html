<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>위험구역 수정</title>
    <!--    CSS 연결    -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <!--    //JS 연결   -->
    <script th:src="@{/js/theme.js}"></script>
</head>
<div th:replace="fragments/header :: header('위험구역 수정')"></div>
<body>
<h2>위험구역 수정</h2>

<div class="roi-wrap">
    <img class="roi-bg" th:src="${streamUrl}" alt="camera">
    <canvas id="roiCanvas" width="800" height="450"></canvas>
</div>

<form th:action="@{/admin/zone/{id}/updateProc(id=${dto.zoneId})}" method="post" th:object="${dto}">
    <input type="hidden" th:field="*{cameraId}">

    <div class="form-row">
        <label>구역 이름</label>
        <input type="text" th:field="*{zoneName}" required>
    </div>

    <div class="form-row">
        <label>구역 타입</label>
        <select th:field="*{zoneType}">
            <option value="DANGER">DANGER</option>
            <option value="CROWD">CROWD</option>
            <option value="WATCH">WATCH</option>
        </select>
    </div>

    <div class="form-row">
        <label>x1</label>
        <input type="number" th:field="*{x1}" id="x1">
    </div>

    <div class="form-row">
        <label>y1</label>
        <input type="number" th:field="*{y1}" id="y1">
    </div>

    <div class="form-row">
        <label>x2</label>
        <input type="number" th:field="*{x2}" id="x2">
    </div>

    <div class="form-row">
        <label>y2</label>
        <input type="number" th:field="*{y2}" id="y2">
    </div>

    <div class="form-row">
        <label>침입 기준 시간(초)</label>
        <input type="number" th:field="*{intrusionTimeSec}">
    </div>

    <div class="form-row">
        <label>활성 여부</label>
        <select th:field="*{isActive}">
            <option th:value="true">true</option>
            <option th:value="false">false</option>
        </select>
    </div>

    <button type="submit">수정</button>
    <a th:href="@{/admin/zone/{cameraId}(cameraId=${dto.cameraId})}">목록</a>
</form>

<script>
    const canvas = document.getElementById("roiCanvas");
    const ctx = canvas.getContext("2d");

    const x1Input = document.getElementById("x1");
    const y1Input = document.getElementById("y1");
    const x2Input = document.getElementById("x2");
    const y2Input = document.getElementById("y2");

    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: Math.round(e.clientX - rect.left),
            y: Math.round(e.clientY - rect.top)
        };
    }

    function drawRect(x1, y1, x2, y2) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (x1 === "" || y1 === "" || x2 === "" || y2 === "") return;

        const left = Math.min(Number(x1), Number(x2));
        const top = Math.min(Number(y1), Number(y2));
        const width = Math.abs(Number(x2) - Number(x1));
        const height = Math.abs(Number(y2) - Number(y1));

        ctx.strokeStyle = "red";
        ctx.lineWidth = 2;
        ctx.strokeRect(left, top, width, height);

        ctx.fillStyle = "rgba(255, 0, 0, 0.15)";
        ctx.fillRect(left, top, width, height);
    }

    canvas.addEventListener("mousedown", (e) => {
        const pos = getMousePos(e);
        isDrawing = true;
        startX = pos.x;
        startY = pos.y;
        currentX = pos.x;
        currentY = pos.y;
        drawRect(startX, startY, currentX, currentY);
    });

    canvas.addEventListener("mousemove", (e) => {
        if (!isDrawing) return;
        const pos = getMousePos(e);
        currentX = pos.x;
        currentY = pos.y;
        drawRect(startX, startY, currentX, currentY);
    });

    canvas.addEventListener("mouseup", (e) => {
        if (!isDrawing) return;
        isDrawing = false;

        const pos = getMousePos(e);
        currentX = pos.x;
        currentY = pos.y;

        const left = Math.min(startX, currentX);
        const top = Math.min(startY, currentY);
        const right = Math.max(startX, currentX);
        const bottom = Math.max(startY, currentY);

        x1Input.value = left;
        y1Input.value = top;
        x2Input.value = right;
        y2Input.value = bottom;

        drawRect(left, top, right, bottom);
    });

    canvas.addEventListener("mouseleave", () => {
        if (!isDrawing) return;
        isDrawing = false;
    });

    window.addEventListener("load", () => {
        if (x1Input.value && y1Input.value && x2Input.value && y2Input.value) {
            drawRect(x1Input.value, y1Input.value, x2Input.value, y2Input.value);
        }
    });
</script>

</body>
</html>
