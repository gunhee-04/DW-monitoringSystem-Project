<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>위험구역 목록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dangerzone.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header('위험구역 목록')}"></div>

<div class="page-wrap">
    <h2 class="page-title">위험구역 목록</h2>

    <div class="toolbar">
        <a class="btn" th:href="@{/admin/zone/{cameraId}/create(cameraId=${cameraId})}">위험구역 등록</a>
        <a class="btn btn-secondary" th:href="@{/admin/camera/list}">카메라 목록</a>
    </div>

    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>구역 이름</th>
                <th>구역 타입</th>
                <th>ROI</th>
                <th>침입 기준 시간</th>
                <th>활성 여부</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(list)}" class="empty-row">
                <td colspan="7">등록된 위험구역이 없습니다.</td>
            </tr>
            <tr th:each="zone : ${list}">
                <td th:text="${zone.id}"></td>
                <td th:text="${zone.zoneName}"></td>
                <td><span class="badge" th:text="${zone.zoneType}"></span></td>
                <td>
                    <span th:text="${zone.x1}"></span>,
                    <span th:text="${zone.y1}"></span>
                    ~
                    <span th:text="${zone.x2}"></span>,
                    <span th:text="${zone.y2}"></span>
                </td>
                <td th:text="${zone.intrusionTimeSec} + '초'"></td>
                <td>
                    <span class="badge" th:text="${zone.isActive ? '활성' : '비활성'}"></span>
                </td>
                <td>
                    <div class="link-actions">
                        <a class="btn btn-secondary" th:href="@{/admin/zone/detail/{id}(id=${zone.id})}">상세</a>
                        <a class="btn" th:href="@{/admin/zone/{id}/update(id=${zone.id})}">수정</a>
                        <form class="inline-form" th:action="@{/admin/zone/{id}/delete(id=${zone.id})}" method="post">
                            <input type="hidden" name="cameraId" th:value="${cameraId}">
                            <button class="btn btn-danger" type="submit" onclick="return confirm('비활성화하시겠습니까?');">삭제</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
