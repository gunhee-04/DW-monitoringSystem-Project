<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 안전 관제 대시보드</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=3a617da73b0f244b54d8271ca81260fd&autoload=false"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/theme.js}"></script>

    <style>
        .main-grid {
            display: grid;
            grid-template-columns: 1.8fr 0.75fr;
            gap: 16px;
        }

        .video-panel {
            padding: 16px;
        }

        .video-frame {
            width: 100%;
            height: 400px;
            min-height: auto;
            background: var(--video-bg);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-frame video,
        .video-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .side-info div {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }

        .side-info div:last-child {
            justify-content: flex-start;
        }

        .side-info strong {
            min-width: 30px;
        }

        .side-panel {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            flex: 1;
            height: 44px;
            border: 1px solid var(--border-color);
            background: var(--bg-soft);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        #map {
            width: 100%;
            height: 280px;
            border-radius: 14px;
            background: #1e293b;
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid var(--border-color);
        }

        .side-info {
            background: var(--bg-soft);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            line-height: 1.8;
            transition: all 0.25s ease;
        }

        .side-info.active-crowd {
            border: 2px solid #3b82f6;
            background: var(--bg-soft-2);
        }

        .side-info.active-danger {
            border: 2px solid #ef4444;
            background: var(--bg-danger-soft);
        }

        .stats-grid {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            align-items: stretch;
        }

        .stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.25s ease, border-color 0.25s ease;
            min-height: 132px;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 15px;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 6px;
        }

        .stat-sub {
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .chart-panel {
            margin-top: 16px;
            padding: 16px;
        }

        .chart-wrap {
            position: relative;
            width: 100%;
            height: 260px;
        }

        .bottom-grid {
            margin-top: 16px;
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 16px;
        }

        .table-panel,
        .log-panel {
            padding: 16px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .toolbar label {
            font-size: 14px;
            font-weight: 700;
        }

        .toolbar input {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
        }

        .toolbar input::-webkit-calendar-picker-indicator {
            filter: invert(0);
        }

        body.dark-mode .toolbar input::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        .log-box {
            height: 320px;
            overflow-y: auto;
            background: var(--log-bg);
            border-radius: 12px;
            padding: 14px;
            color: white;
            border: 1px solid var(--border-color);
        }

        .log-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 14px;
        }

        .log-danger {
            color: #ff6b6b;
            font-weight: 700;
        }

        .log-normal {
            color: #4ade80;
            font-weight: 700;
        }

        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .bottom-grid {
                grid-template-columns: 1fr;
            }

            .video-frame {
                height: 360px;
            }
        }

        @media (max-width: 900px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div th:replace="fragments/header :: header('스마트 안전 관제 시스템')"></div>

<div class="container">
    <div class="main-grid">
        <div class="panel video-panel">
            <div class="panel-title">🎥 실시간 드론 영상</div>
            <div class="video-frame">
                <img id="stream-video"
                     src="http://localhost:5001/video"
                     alt="드론 영상"
                     onerror="this.src='https://dummyimage.com/1200x700/0f172a/ffffff&text=Drone+Offline'">

                <video id="file-video" autoplay muted loop controls style="display:none;">
                    <source src="/videos/test1.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="panel side-panel">
            <div>
                <div class="panel-title">📡 관제 모드</div>
                <div class="mode-buttons">
                    <button id="crowd-btn" class="mode-btn active" onclick="switchMode('crowd')">밀집</button>
                    <button id="danger-btn" class="mode-btn" onclick="switchMode('danger')">위험</button>
                </div>
            </div>

            <div>
                <div class="panel-title">🗺 드론 위치 지도</div>
                <div id="map"></div>
            </div>

            <div class="side-info">
                <div><strong>선택 모드:</strong> <span id="selected-mode-text">밀집 관제</span></div>
                <div><strong>선택 드론:</strong> <span id="selected-drone-text">DRONE-01</span></div>
                <div><strong>현재 상태:</strong> <span id="selected-status-badge" class="status-badge badge-crowd">밀집</span></div>
            </div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card" onclick="openReportModal('card1')">
            <div class="stat-label" id="card1-label">평균 밀집</div>
            <div class="stat-value" id="card1-value">0</div>
            <div class="stat-sub" id="card1-sub">현재 선택된 드론 기준</div>
        </div>

        <div class="stat-card" onclick="openReportModal('card2')">
            <div class="stat-label" id="card2-label">최대 밀집(시간별)</div>
            <div class="stat-value" id="card2-value">0</div>
            <div class="stat-sub" id="card2-sub">시간대별 최대값</div>
        </div>

        <div class="stat-card" onclick="openReportModal('card3')">
            <div class="stat-label" id="card3-label">밀집도 증가율</div>
            <div class="stat-value" id="card3-value">0%</div>
            <div class="stat-sub" id="card3-sub">이전 구간 대비</div>
        </div>
    </div>

    <div class="panel chart-panel">
        <div class="panel-title">📊 실시간 통계 그래프</div>
        <div class="chart-wrap">
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <div class="bottom-grid">
        <div class="panel table-panel">
            <div class="panel-title">📈 시간대별 통계</div>

            <div class="toolbar">
                <label for="start">시작</label>
                <input type="datetime-local" id="start">

                <label for="end">종료</label>
                <input type="datetime-local" id="end">

                <button class="btn" onclick="loadDashboardData()">조회</button>
                <button class="btn gray" onclick="setTodayRange()">오늘 기준</button>
            </div>

            <table>
                <thead>
                <tr>
                    <th>시간</th>
                    <th id="table-col-1">총 인원 수</th>
                    <th id="table-col-2">평균 밀집도</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody id="hourly-body">
                <tr>
                    <td colspan="4">데이터 없음</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="panel log-panel">
            <div class="panel-title">🚨 실시간 탐지 로그</div>
            <div id="log-box" class="log-box">
                <div class="log-item">데이터를 불러오는 중입니다...</div>
            </div>
        </div>
    </div>
</div>

<div id="report-modal-backdrop" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="modal-title">상세 통계</div>
            <button class="close-btn" onclick="closeReportModal()">&times;</button>
        </div>

        <div class="report-tabs">
            <button class="tab-btn active" onclick="setReportTab(this, 'day')">일</button>
            <button class="tab-btn" onclick="setReportTab(this, 'week')">주</button>
            <button class="tab-btn" onclick="setReportTab(this, 'month')">월</button>
            <button class="tab-btn" onclick="setReportTab(this, 'year')">년</button>
        </div>

        <div class="modal-actions">
            <button class="btn" onclick="downloadPdf()">PDF 다운로드</button>
            <button class="btn gray" onclick="downloadExcel()">EXCEL 다운로드</button>
        </div>

        <div id="report-content">
            <div id="report-summary" class="report-placeholder"></div>

            <div class="chart-wrap" style="margin-top:16px; height:260px;">
                <canvas id="reportChart"></canvas>
            </div>

            <div style="margin-top:16px;">
                <table>
                    <thead>
                    <tr>
                        <th>구간</th>
                        <th>값</th>
                        <th>비고</th>
                    </tr>
                    </thead>
                    <tbody id="report-table-body">
                    <tr>
                        <td colspan="3">데이터 없음</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const state = {
        mode: "crowd",
        selectedDroneId: "DRONE-01",
        selectedReportTab: "day",
        selectedCardKey: "card1",
        timer: null,
        pollingMs: 5000,
        isLoading: false,
        abortController: null,
        realtimeData: null,
        realtimeLogs: [],
        lastDismissedTime: "",
        mainChart: null,
        reportChart: null,
        map: null,
        markers: []
    };

    const droneData = [
        {
            id: "DRONE-01",
            lat: 37.5665,
            lng: 126.9780,
            switchUrl: "http://localhost:5001/switch/webcam",
            videoUrl: "http://localhost:5001/video",
            mode: "crowd",
            cameraId: 1
        },
        {
            id: "DRONE-02",
            lat: 37.5651,
            lng: 126.9895,
            switchUrl: "http://localhost:5001/switch/drone1",
            videoUrl: "http://localhost:5001/video",
            mode: "crowd",
            cameraId: 2
        },
        {
            id: "DRONE-03",
            lat: 37.5700,
            lng: 126.9820,
            switchUrl: "http://localhost:5001/switch/drone2",
            videoUrl: "http://localhost:5001/video",
            mode: "danger",
            cameraId: 3
        }
    ];

    const API = {
        crowdSummary: (cameraId, start, end) =>
            `/api/statistics/crowd/summary?cameraId=${cameraId}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`,

        crowdHourly: (cameraId, start, end) =>
            `/api/statistics/crowd/hourly?cameraId=${cameraId}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`,

        dangerSummary: (cameraId, start, end) =>
            `/api/statistics/danger/summary?cameraId=${cameraId}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`,

        dangerHourly: (cameraId, start, end) =>
            `/api/statistics/danger/hourly?cameraId=${cameraId}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`,

        logs: () => `/get_logs`,
        sse: () => `/api/sse/connect`
    };

    function safeNumber(value, fallback = 0) {
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
}

function getSelectedDrone() {
    return droneData.find(d => d.id === state.selectedDroneId) || droneData[0];
}

function getChartColors() {
    const style = getComputedStyle(document.body);
    return {
        grid: style.getPropertyValue("--chart-grid").trim() || "rgba(148, 163, 184, 0.25)",
        tick: style.getPropertyValue("--chart-tick").trim() || "#475569",
        line: style.getPropertyValue("--chart-line").trim() || "#2563eb",
        fill: style.getPropertyValue("--chart-fill").trim() || "rgba(37, 99, 235, 0.15)"
    };
}

function formatDateTimeLocal(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    const hh = String(date.getHours()).padStart(2, "0");
    const mm = String(date.getMinutes()).padStart(2, "0");
    return `${y}-${m}-${d}T${hh}:${mm}`;
}

    function formatDateTimeParam(value) {
        return value + ":00";
    }

    function setTodayRange() {
        const now = new Date();
        const start = new Date();
        start.setHours(0, 0, 0, 0);

        document.getElementById("start").value = formatDateTimeLocal(start);
        document.getElementById("end").value = formatDateTimeLocal(now);
    }

    function getRangeParams() {
        const startValue = document.getElementById("start").value;
        const endValue = document.getElementById("end").value;

        if (!startValue || !endValue) {
            return null;
        }

        if (startValue > endValue) {
            alert("시작 시간이 종료 시간보다 늦을 수 없습니다.");
            return null;
        }

        return {
            start: formatDateTimeParam(startValue),
            end: formatDateTimeParam(endValue)
        };
    }

    function updateCardTitles() {
        if (state.mode === "crowd") {
            document.getElementById("card1-label").innerText = "평균 밀집";
            document.getElementById("card2-label").innerText = "최대 밀집(시간별)";
            document.getElementById("card3-label").innerText = "밀집도 증가율";
            document.getElementById("card1-sub").innerText = "현재 선택된 드론 기준";
            document.getElementById("card2-sub").innerText = "시간대별 최대값";
            document.getElementById("card3-sub").innerText = "이전 구간 대비";
        } else {
            document.getElementById("card1-label").innerText = "총 침입 수";
            document.getElementById("card2-label").innerText = "시간당 침입 횟수";
            document.getElementById("card3-label").innerText = "평균 체류 시간";
            document.getElementById("card1-sub").innerText = "위험 이벤트 기준";
            document.getElementById("card2-sub").innerText = "시간 단위 집계";
            document.getElementById("card3-sub").innerText = "평균 체류 시간 기준";
        }
    }

    function updateTableHeaders() {
        if (state.mode === "crowd") {
            document.getElementById("table-col-1").innerText = "총 인원 수";
            document.getElementById("table-col-2").innerText = "평균 밀집도";
        } else {
            document.getElementById("table-col-1").innerText = "침입 횟수";
            document.getElementById("table-col-2").innerText = "평균 체류 시간";
        }
    }

    function updateVideoByMode() {
        const matchedDrone =
            droneData.find(drone => drone.id === state.selectedDroneId) ||
            droneData.find(drone => drone.mode === state.mode) ||
            droneData[0];

        state.selectedDroneId = matchedDrone.id;
        document.getElementById("selected-drone-text").innerText = matchedDrone.id;

        const stream = document.getElementById("stream-video");
        const video = document.getElementById("file-video");

        if ((matchedDrone.videoUrl || "").endsWith(".mp4")) {
            stream.style.display = "none";
            video.style.display = "block";
            video.src = matchedDrone.videoUrl;
            video.load();
            video.play().catch(() => {});
        } else {
            if (video) {
                video.pause();
                video.style.display = "none";
            }
            stream.style.display = "block";
            stream.src = matchedDrone.videoUrl + "?t=" + Date.now();
        }
    }

    function switchMode(mode) {
        state.mode = mode;

        document.getElementById("crowd-btn").classList.toggle("active", mode === "crowd");
        document.getElementById("danger-btn").classList.toggle("active", mode === "danger");

        const sideInfo = document.querySelector(".side-info");
        sideInfo.classList.remove("active-crowd", "active-danger");

        if (mode === "crowd") {
            document.getElementById("selected-mode-text").innerText = "밀집 관제";
            document.getElementById("selected-status-badge").innerText = "밀집";
            document.getElementById("selected-status-badge").className = "status-badge badge-crowd";
            sideInfo.classList.add("active-crowd");
        } else {
            document.getElementById("selected-mode-text").innerText = "위험 관제";
            document.getElementById("selected-status-badge").innerText = "위험";
            document.getElementById("selected-status-badge").className = "status-badge badge-danger";
            sideInfo.classList.add("active-danger");
        }

        updateCardTitles();
        updateTableHeaders();
        updateVideoByMode();
    }

    async function fetchCrowdRealtime(signal) {
        const range = getRangeParams();
        if (!range) return null;

        const drone = getSelectedDrone();

        const [summaryRes, hourlyRes] = await Promise.all([
            fetch(API.crowdSummary(drone.cameraId, range.start, range.end), { signal }),
            fetch(API.crowdHourly(drone.cameraId, range.start, range.end), { signal })
        ]);

        if (!summaryRes.ok) throw new Error("crowd summary 조회 실패");
        if (!hourlyRes.ok) throw new Error("crowd hourly 조회 실패");

        const summaryJson = await summaryRes.json();
        const hourlyJson = await hourlyRes.json();

        return {
            mode: "crowd",
            summary: {
                card1: safeNumber(summaryJson.averageDensityValue),
                card2: safeNumber(summaryJson.maxPeopleCount),
                card3: safeNumber(summaryJson.averageIncreaseRate)
            },
            hourly: (hourlyJson || []).map(x => ({
                label: x.hour ?? "-",
                value1: safeNumber(x.totalPeopleCount),
                value2: safeNumber(x.averageDensityValue),
                status: "-",
                rowClass: ""
            })),
            logs: state.realtimeLogs || []
        };
    }

    async function fetchDangerRealtime(signal) {
        const range = getRangeParams();
        if (!range) return null;

        const drone = getSelectedDrone();

        const [summaryRes, hourlyRes] = await Promise.all([
            fetch(API.dangerSummary(drone.cameraId, range.start, range.end), { signal }),
            fetch(API.dangerHourly(drone.cameraId, range.start, range.end), { signal })
        ]);

        if (!summaryRes.ok) throw new Error("danger summary 조회 실패");
        if (!hourlyRes.ok) throw new Error("danger hourly 조회 실패");

        const summaryJson = await summaryRes.json();
        const hourlyJson = await hourlyRes.json();

        return {
            mode: "danger",
            summary: {
                card1: safeNumber(summaryJson.totalIntrusion),
                card2: safeNumber(summaryJson.maxHourlyIntrusion),
                card3: safeNumber(summaryJson.averageStayDuration)
            },
            hourly: (hourlyJson || []).map(x => ({
                label: x.hour ?? "-",
                value1: safeNumber(x.intrusionCount),
                value2: safeNumber(x.averageStayDuration),
                status: safeNumber(x.intrusionCount) >= 3 ? "위험" : "주의",
                rowClass: safeNumber(x.intrusionCount) >= 3 ? "danger-row" : "warning-row"
            })),
            logs: state.realtimeLogs || []
        };
    }

    async function fetchRealtimeData() {
        if (state.isLoading) return;
        state.isLoading = true;

        if (state.abortController) state.abortController.abort();
        state.abortController = new AbortController();

        try {
            const data = state.mode === "crowd"
                ? await fetchCrowdRealtime(state.abortController.signal)
                : await fetchDangerRealtime(state.abortController.signal);

            state.realtimeData = data;
            renderDashboard();
        } catch (e) {
            if (e.name !== "AbortError") {
                console.error("실시간 데이터 조회 실패:", e);
            }
        } finally {
            state.isLoading = false;
        }
    }

    function renderDashboard() {
        const d = state.realtimeData;
        if (!d) return;

        if (state.mode === "crowd") {
            document.getElementById("card1-value").innerText = d.summary.card1.toFixed(2);
            document.getElementById("card2-value").innerText = d.summary.card2;
            document.getElementById("card3-value").innerText = d.summary.card3.toFixed(1) + "%";
        } else {
            document.getElementById("card1-value").innerText = d.summary.card1;
            document.getElementById("card2-value").innerText = d.summary.card2;
            document.getElementById("card3-value").innerText = d.summary.card3.toFixed(1) + "초";
        }

        renderTable(d.hourly);
        renderChart(d.hourly);

        if (d.logs) {
            renderLogs(d.logs);
        }

        if (document.getElementById("report-modal-backdrop").style.display === "flex") {
            renderReportModal();
        }
    }

    function renderTable(list) {
        const body = document.getElementById("hourly-body");
        body.innerHTML = "";

        if (!list || !list.length) {
            body.innerHTML = `<tr><td colspan="4">데이터 없음</td></tr>`;
            return;
        }

        list.forEach(x => {
            body.innerHTML += `
                <tr class="${x.rowClass || ""}">
                    <td>${x.label}</td>
                    <td>${x.value1}</td>
                    <td>${state.mode === "crowd" ? x.value2.toFixed(2) : x.value2.toFixed(1) + "초"}</td>
                    <td>${x.status}</td>
                </tr>
            `;
        });
    }

    function renderChart(list) {
        const ctx = document.getElementById("mainChart").getContext("2d");
        const colors = getChartColors();

        if (state.mainChart) {
            state.mainChart.destroy();
        }

        state.mainChart = new Chart(ctx, {
            type: state.mode === "crowd" ? "line" : "bar",
            data: {
                labels: list.map(x => x.label),
                datasets: [{
                    label: state.mode === "crowd" ? "평균 밀집도" : "시간당 침입 횟수",
                    data: list.map(x => state.mode === "crowd" ? x.value2 : x.value1),
                    borderColor: colors.line,
                    backgroundColor: colors.fill,
                    borderWidth: 2,
                    fill: state.mode === "crowd",
                    tension: 0.3,
                    pointRadius: state.mode === "crowd" ? 4 : 0,
                    pointHoverRadius: state.mode === "crowd" ? 6 : 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    }

    function renderLogs(logs) {
        const box = document.getElementById("log-box");

        if (!logs || !logs.length) {
            box.innerHTML = `<div class="log-item">로그 데이터 없음</div>`;
            return;
        }

        box.innerHTML = logs.map(log => `
            <div class="log-item" style="border-left: 4px solid ${log.level_color || "#64748b"}; margin-bottom: 5px; padding-left: 8px;">
                <span style="color: ${log.level_color || "#64748b"}; font-weight: bold;">
                    ${log.status_text || "-"}
                </span>
                인원: ${safeNumber(log.people_count)}명 |
                시간: ${log.created_at || "-"}
            </div>
        `).join("");

        updateAlertPanel(logs);
    }

    function updateAlertPanel(data) {
        const high = (data || []).filter(x => x.alert === true);
        const latest = high[0];

        if (latest && latest.created_at !== state.lastDismissedTime) {
            showDangerPopup(latest);
        }
    }

    function showDangerPopup(log) {
    const oldPopup = document.getElementById("dynamic-danger-alert");
    if (oldPopup) return;

    const popup = document.createElement("div");
    popup.id = "dynamic-danger-alert";
    popup.innerHTML = `
        <div style="font-size:24px; margin-bottom:10px;">🚨 ${log.status_text || "위험 감지"} 🚨</div>
        <div style="font-size:18px;">인원: ${safeNumber(log.people_count)}명</div>
        <div style="font-size:14px; margin-top:10px;">${log.created_at || "-"}</div>
        <button onclick="state.lastDismissedTime='${log.created_at}'; this.parentElement.remove();"
            style="margin-top:15px; padding:8px 20px; border:none; cursor:pointer;">
           닫기
        </button>
    `;
    popup.style.position = "fixed";
    popup.style.top = "50%";
    popup.style.left = "50%";
    popup.style.transform = "translate(-50%, -50%)";
    popup.style.background = "#ef4444";
    popup.style.color = "white";
    popup.style.padding = "25px";
    popup.style.borderRadius = "15px";
    popup.style.zIndex = "10000";
    popup.style.textAlign = "center";
    popup.style.boxShadow = "0 10px 40px rgba(0,0,0,0.4)";
    document.body.appendChild(popup);

    setTimeout(() => {
        const nowPopup = document.getElementById("dynamic-danger-alert");
        if (nowPopup) nowPopup.remove();
    }, 5000);
}

    function getCurrentReportData() {
        const hourly = state.realtimeData?.hourly || [];
        const labels = hourly.map(item => item.label);

        if (state.mode === "crowd") {
            if (state.selectedCardKey === "card1") {
                return {
                    title: "평균 밀집 상세 통계",
                    datasetLabel: "평균 밀집도",
                    labels,
                    values: hourly.map(item => item.value2),
                    unit: ""
                };
            }
            if (state.selectedCardKey === "card2") {
                return {
                    title: "최대 밀집 상세 통계",
                    datasetLabel: "총 인원 수",
                    labels,
                    values: hourly.map(item => item.value1),
                    unit: "명"
                };
            }
            return {
                title: "밀집도 증가율 상세 통계",
                datasetLabel: "평균 밀집도",
                labels,
                values: hourly.map(item => item.value2),
                unit: ""
            };
        }

        if (state.selectedCardKey === "card1") {
            return {
                title: "총 침입 수 상세 통계",
                datasetLabel: "침입 횟수",
                labels,
                values: hourly.map(item => item.value1),
                unit: "건"
            };
        }

        if (state.selectedCardKey === "card2") {
            return {
                title: "시간당 침입 횟수 상세 통계",
                datasetLabel: "시간당 침입 횟수",
                labels,
                values: hourly.map(item => item.value1),
                unit: "건"
            };
        }

        return {
            title: "평균 체류 시간 상세 통계",
            datasetLabel: "평균 체류 시간",
            labels,
            values: hourly.map(item => item.value2),
            unit: "초"
        };
    }

    function openReportModal(cardKey) {
        state.selectedCardKey = cardKey;
        document.getElementById("report-modal-backdrop").style.display = "flex";
        renderReportModal();
    }

    function renderReportModal() {
        const report = getCurrentReportData();
        const colors = getChartColors();

        document.getElementById("modal-title").innerText = report.title;

        const summary = document.getElementById("report-summary");
        summary.innerHTML = `
            현재 선택 모드: <strong>${state.mode === "crowd" ? "밀집" : "위험"}</strong><br>
            선택 드론: <strong>${state.selectedDroneId}</strong><br>
            선택 항목: <strong>${report.datasetLabel}</strong><br>
            선택 기간: <strong>${state.selectedReportTab}</strong>
        `;

        const tbody = document.getElementById("report-table-body");
        tbody.innerHTML = "";

        if (!report.labels.length) {
            tbody.innerHTML = `<tr><td colspan="3">데이터 없음</td></tr>`;
        } else {
            report.labels.forEach((label, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${label}</td>
                        <td>${report.values[index]}${report.unit}</td>
                        <td>${report.datasetLabel}</td>
                    </tr>
                `;
            });
        }

        const canvas = document.getElementById("reportChart");
        const ctx = canvas.getContext("2d");

        if (state.reportChart) {
            state.reportChart.destroy();
            state.reportChart = null;
        }

        if (!report.labels.length) return;

        state.reportChart = new Chart(ctx, {
            type: state.mode === "crowd" ? "line" : "bar",
            data: {
                labels: report.labels,
                datasets: [{
                    label: report.datasetLabel,
                    data: report.values,
                    borderColor: colors.line,
                    backgroundColor: colors.fill,
                    borderWidth: 2,
                    fill: state.mode === "crowd",
                    tension: 0.3,
                    pointRadius: state.mode === "crowd" ? 4 : 0,
                    pointHoverRadius: state.mode === "crowd" ? 6 : 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    }

    function closeReportModal() {
        document.getElementById("report-modal-backdrop").style.display = "none";
        if (state.reportChart) {
            state.reportChart.destroy();
            state.reportChart = null;
        }
    }

    function setReportTab(button, tab) {
        state.selectedReportTab = tab;
        document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
        renderReportModal();
    }

    function downloadPdf() {
        const range = getRangeParams();
        if (!range) return;

        const drone = getSelectedDrone();
        const reportType = state.mode === "crowd" ? "CROWD" : "DANGER";
        const category = state.selectedReportTab.toUpperCase();

        const url =
            `/api/reports/pdf?cameraId=${drone.cameraId}` +
            `&start=${encodeURIComponent(range.start)}` +
            `&end=${encodeURIComponent(range.end)}` +
            `&reportType=${reportType}` +
            `&category=${category}`;

        window.open(url, "_blank");
    }

    function downloadExcel() {
        const range = getRangeParams();
        if (!range) return;

        const drone = getSelectedDrone();
        const reportType = state.mode === "crowd" ? "CROWD" : "DANGER";
        const category = state.selectedReportTab.toUpperCase();

        const url =
            `/api/reports/excel?cameraId=${drone.cameraId}` +
            `&start=${encodeURIComponent(range.start)}` +
            `&end=${encodeURIComponent(range.end)}` +
            `&reportType=${reportType}` +
            `&category=${category}`;

        window.open(url, "_blank");
    }

    function connectSse() {
    const es = new EventSource(API.sse());

    es.addEventListener("newDetection", e => {
        const log = JSON.parse(e.data);
        state.realtimeLogs.unshift(log);
        state.realtimeLogs = state.realtimeLogs.slice(0, 50);
        renderLogs(state.realtimeLogs);
    });

    es.addEventListener("danger_alert", e => {
    const log = JSON.parse(e.data);

    const unreadBadge = document.getElementById("alert-badge");
    if (unreadBadge) {
        let count = parseInt(unreadBadge.innerText) || 0;
        unreadBadge.innerText = count + 1;
        unreadBadge.style.display = "flex";
    }

    const alertList = document.getElementById("alert-list");
    if (alertList) {
        const empty = alertList.querySelector(".alert-empty");
        if (empty) {
            empty.remove();
        }

    const item = document.createElement("div");
        item.className = "alert-item danger";

        item.innerHTML = `
            <div><strong>${log.status_text || "위험 감지"}</strong></div>
            <div>인원: ${safeNumber(log.people_count)}명</div>
            <div>${log.created_at || "-"}</div>
        `;

        alertList.prepend(item);
        }

        if (log.created_at !== state.lastDismissedTime) {
            showDangerPopup(log);
        }
        });

            es.onerror = () => {
                es.close();
                setTimeout(connectSse, 3000);
            };
        }

    async function loadInitialLogs() {
        try {
            const res = await fetch(API.logs());
            const data = await res.json();

            state.realtimeLogs = Array.isArray(data.logs) ? data.logs : [];
            renderLogs(state.realtimeLogs);
        } catch (e) {
            state.realtimeLogs = [];
            renderLogs(state.realtimeLogs);
        }
    }

    function startPolling() {
        fetchRealtimeData();
        state.timer = setInterval(fetchRealtimeData, state.pollingMs);
    }

    function loadDashboardData() {
        fetchRealtimeData();
    }

    function initKakaoMap() {
        const mapContainer = document.getElementById("map");
        const mapOption = {
            center: new kakao.maps.LatLng(37.5665, 126.9780),
            level: 5
        };

        state.map = new kakao.maps.Map(mapContainer, mapOption);
        state.markers = [];

        droneData.forEach(drone => {
            const position = new kakao.maps.LatLng(drone.lat, drone.lng);

            const markerImageSrc = drone.mode === "crowd"
                ? "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png"
                : "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png";

            const markerImage = new kakao.maps.MarkerImage(
                markerImageSrc,
                new kakao.maps.Size(24, 35)
            );

            const marker = new kakao.maps.Marker({
                position,
                title: drone.id,
                image: markerImage
            });

            marker.setMap(state.map);
            state.markers.push(marker);

            kakao.maps.event.addListener(marker, "click", function () {
                const applyDroneSelection = () => {
                    state.selectedDroneId = drone.id;
                    state.mode = drone.mode;

                    state.markers.forEach(m => m.setZIndex(1));
                    marker.setZIndex(999);
                    state.map.panTo(position);

                    document.getElementById("selected-drone-text").innerText = drone.id;
                    switchMode(drone.mode);
                };

                if (drone.switchUrl) {
                    fetch(drone.switchUrl)
                        .then(() => applyDroneSelection())
                        .catch(() => applyDroneSelection());
                } else {
                    applyDroneSelection();
                }
            });
        });
    }

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            closeReportModal();
            const popup = document.getElementById("dynamic-danger-alert");
            if (popup) popup.remove();
        }
    });

    const modal = document.getElementById("report-modal-backdrop");

    if (modal) {
        modal.addEventListener("click", function (event) {
            if (event.target === this) {
                closeReportModal();
            }
        });
    }

    kakao.maps.load(function () {
        setTodayRange();
        initKakaoMap();
        updateVideoByMode();
        updateCardTitles();
        updateTableHeaders();
        loadInitialLogs();
        connectSse();
        startPolling();
    });
</script>
