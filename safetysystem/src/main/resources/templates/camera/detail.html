<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카메라 상세보기</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 700px; }
        th, td { border: 1px solid #ccc; padding: 10px; }
        th { width: 180px; background: #f2f2f2; text-align: left; }
    </style>
</head>
<body>
<h2>카메라 상세보기</h2>

<table>
    <tr><th>ID</th><td th:text="${dto.cameraId}"></td></tr>
    <tr><th>카메라 코드</th><td th:text="${dto.cameraCode}"></td></tr>
    <tr><th>카메라 이름</th><td th:text="${dto.cameraName}"></td></tr>
    <tr><th>카메라 타입</th><td th:text="${dto.cameraType}"></td></tr>
    <tr><th>IP 주소</th><td th:text="${dto.ipAddress}"></td></tr>
    <tr><th>스트림 URL</th><td th:text="${dto.streamUrl}"></td></tr>
    <tr><th>위치 이름</th><td th:text="${dto.locationName}"></td></tr>
    <tr><th>위도</th><td th:text="${dto.latitude}"></td></tr>
    <tr><th>경도</th><td th:text="${dto.longitude}"></td></tr>
    <tr><th>상태</th><td th:text="${dto.status}"></td></tr>
</table>

<div style="margin-top: 20px;">
    <a th:href="@{/admin/camera/{id}/update(id=${dto.cameraId})}">수정</a>
    <a th:href="@{/admin/zone/{cameraId}(cameraId=${dto.cameraId})}">위험구역 목록</a>
    <a th:href="@{/admin/camera/list}">목록</a>
</div>

</body>
</html>
