<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카메라 상세</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/camera.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>

<div th:replace="fragments/header :: header('카메라 상세')"></div>

<div class="camera-page camera-page--narrow">

    <h2 class="camera-page__title">카메라 상세</h2>

    <div class="camera-detail-card">
        <table class="camera-detail-table">
            <tbody>
            <tr>
                <th>카메라 코드</th>
                <td th:text="${dto.cameraCode}">CAM-02</td>
            </tr>
            <tr>
                <th>카메라 이름</th>
                <td th:text="${dto.cameraName}">드론 카메라</td>
            </tr>
            <tr>
                <th>카메라 타입</th>
                <td th:text="${dto.cameraType}">DRONE</td>
            </tr>
            <tr>
                <th>IP 주소</th>
                <td th:text="${dto.ipAddress}">192.168.0.10</td>
            </tr>
            <tr>
                <th>스트림 URL</th>
                <td th:text="${dto.streamUrl}">http://192.168.0.28:5000/video</td>
            </tr>
            <tr>
                <th>위치 이름</th>
                <td th:text="${dto.locationName}">야외</td>
            </tr>
            <tr>
                <th>위도</th>
                <td th:text="${dto.latitude}">36.351</td>
            </tr>
            <tr>
                <th>경도</th>
                <td th:text="${dto.longitude}">127.385</td>
            </tr>
            <tr>
                <th>상태</th>
                <td th:text="${dto.status}">ACTIVE</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="camera-detail-actions">
        <a th:href="@{/admin/camera/{id}/update(id=${dto.cameraId})}" class="btn btn-primary">수정</a>
        <a th:href="@{/admin/camera/list}" class="btn btn-secondary">목록</a>
    </div>

</div>

</body>
</html>
