<div th:fragment="header(title)"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div class="topbar">

        <!-- 왼쪽 -->
        <div class="topbar-left">
            <a th:href="@{/}" class="logo-link">
                <img id="main-logo"
                     th:src="@{/images/logo-light.png}"
                     data-light="/images/logo-light.png"
                     data-dark="/images/logo-dark.png"
                     class="logo-img">
                <div class="logo-text" th:text="${title}">스마트 안전 관제 시스템</div>
            </a>
        </div>

        <!-- 오른쪽 -->
        <div class="topbar-right">

            <!-- 다크모드 -->
            <button id="theme-toggle-btn"
                    class="theme-toggle-btn"
                    onclick="toggleTheme()">
                🌙 다크네이비
            </button>

            <!-- 알림 -->
            <div class="alert-wrapper">
                <button class="alert-btn" onclick="toggleAlertPanel()">
                    🔔
                    <span id="alert-badge" class="alert-badge">0</span>
                </button>

                <div id="alert-panel" class="alert-panel">
                    <div class="alert-panel-title">중요 알림</div>
                    <div id="alert-list" class="alert-list">
                        <div class="alert-empty">로그 없음</div>
                    </div>
                </div>
            </div>

            <!-- 로그인 안 했을 때 -->
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/member/login}" class="login-link-btn">로그인</a>
            </div>

            <!-- 로그인 했을 때 -->
            <div class="user-dropdown" sec:authorize="isAuthenticated()">
                <button type="button" class="user-box" onclick="toggleUserMenu()">
                    👤 <span sec:authentication="principal.member.name">사용자</span>님
                </button>

                <div id="user-menu" class="user-menu">
                    <a th:href="@{/admin/home}"
                       class="user-menu-item"
                       sec:authorize="hasRole('ADMIN')">
                        관리자 페이지
                    </a>

                    <a th:href="@{/member/list}"
                       class="user-menu-item"
                       sec:authorize="hasRole('ADMIN')">
                        회원목록
                    </a>

                    <form th:action="@{/member/logout}" method="post" class="logout-form">
                        <button type="submit" class="user-menu-item logout-btn">로그아웃</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script>
        function toggleUserMenu() {
            const menu = document.getElementById("user-menu");
            if (menu) {
                menu.classList.toggle("show");
            }
        }

        function toggleAlertPanel() {
            const panel = document.getElementById("alert-panel");
            if (!panel) return;

            const isOpen = panel.style.display === "block";

            if (isOpen) {
                panel.style.display = "none";
            } else {
                panel.style.display = "block";
                panel.style.position = "absolute";
                panel.style.top = "48px";
                panel.style.right = "0";
                panel.style.zIndex = "9999";
            }
        }

        function formatAlertTime(dateTimeString) {
            if (!dateTimeString) return "-";

            const date = new Date(dateTimeString);
            if (Number.isNaN(date.getTime())) {
                return dateTimeString;
            }

            return date.toLocaleString("ko-KR");
        }

        function updateAlertBadge(unreadCount) {
            const badge = document.getElementById("alert-badge");
            if (!badge) return;

            if (unreadCount > 0) {
                badge.innerText = String(unreadCount);
                badge.style.display = "inline-flex";
            } else {
                badge.innerText = "0";
                badge.style.display = "none";
            }
        }

        async function markAlertAsRead(alertId, element) {
            try {
                const res = await fetch(`/alerts/${alertId}/read`, {
                    method: "PATCH"
                });

                if (!res.ok) {
                    throw new Error("읽음 처리 실패");
                }

                if (element) {
                    element.style.opacity = "0.55";
                    element.classList.add("read");
                }
            } catch (e) {
                console.error("알림 읽음 처리 실패:", e);
            }
        }

        function addAlertToPanel(alert) {
            const alertList = document.getElementById("alert-list");
            if (!alertList) return;

            const empty = alertList.querySelector(".alert-empty");
            if (empty) {
                empty.remove();
            }

            const exists = alertList.querySelector(`[data-alert-id="${alert.id}"]`);
            if (exists) {
                return;
            }

            const severity = (alert.severity || "").toUpperCase();
            let severityClass = "medium";
            let severityText = "MEDIUM";

            if (severity === "HIGH") {
                severityClass = "high";
                severityText = "HIGH";
            } else if (severity === "MEDIUM") {
                severityClass = "medium";
                severityText = "MEDIUM";
            } else {
                return;
            }

            const item = document.createElement("div");
            item.className = `alert-item ${severityClass}`;
            item.setAttribute("data-alert-id", alert.id);

            item.innerHTML = `
                <div class="alert-item-header">
                    <div class="alert-item-title">${alert.alertMessage ?? "중요 알림"}</div>
                    <span class="alert-item-badge ${severityClass}">${severityText}</span>
                </div>
                <div class="alert-item-body">
                    <div>시간: ${formatAlertTime(alert.createdAt)}</div>
                    <div>장소: ${alert.location ?? "-"}</div>
                    <div>드론: ${alert.droneId ?? "-"}</div>
                </div>
                <div class="alert-item-actions">
                    <button class="alert-confirm-btn">확인</button>
                </div>
            `;

            const confirmBtn = item.querySelector(".alert-confirm-btn");
            confirmBtn.addEventListener("click", async function () {
                await markAlertAsRead(alert.id, item);

                confirmBtn.disabled = true;
                confirmBtn.innerText = "확인됨";

                const badge = document.getElementById("alert-badge");
                if (badge) {
                    let current = parseInt(badge.innerText || "0", 10) || 0;
                    current = Math.max(0, current - 1);
                    updateAlertBadge(current);
                }

                const floating = document.querySelector(`.floating-alert-card[data-alert-id="${alert.id}"]`);
                if (floating) {
                    floating.remove();
                }
            });

            if (alert.isRead) {
                item.style.opacity = "0.55";
                item.classList.add("read");
                confirmBtn.disabled = true;
                confirmBtn.innerText = "확인됨";
            }

            alertList.prepend(item);
        }

        async function loadUnreadAlerts() {
            const alertList = document.getElementById("alert-list");
            const floatingContainer = document.getElementById("floating-alert-container");

            if (!alertList) return;

            try {
                const res = await fetch("/alerts/recent");
                if (!res.ok) {
                    throw new Error("최근 알림 조회 실패");
                }

                const alerts = await res.json();

                alertList.innerHTML = "";

                if (floatingContainer) {
                    floatingContainer.innerHTML = "";
                }

                let unreadCount = 0;

                alerts.slice().reverse().forEach(alert => {
                    addAlertToPanel(alert);

                    if (!alert.isRead) {
                        unreadCount++;
                    }

                    const severity = (alert.severity || "").toUpperCase();
                    if (!alert.isRead && (severity === "HIGH" || severity === "MEDIUM")) {
                        if (typeof addFloatingAlert === "function") {
                            addFloatingAlert(alert);
                        }
                    }
                });

                if (!alertList.children.length) {
                    alertList.innerHTML = `<div class="alert-empty">로그 없음</div>`;
                }

                updateAlertBadge(unreadCount);
            } catch (e) {
                console.error("초기 알림 조회 실패:", e);
                if (!alertList.children.length) {
                    alertList.innerHTML = `<div class="alert-empty">로그 없음</div>`;
                }
            }
        }

        window.loadUnreadAlerts = loadUnreadAlerts;

        document.addEventListener("click", function (event) {
            const panel = document.getElementById("alert-panel");
            const wrapper = document.querySelector(".alert-wrapper");
            const userMenu = document.getElementById("user-menu");
            const userDropdown = document.querySelector(".user-dropdown");

            if (panel && wrapper && !wrapper.contains(event.target)) {
                panel.style.display = "none";
            }

            if (userMenu && userDropdown && !userDropdown.contains(event.target)) {
                userMenu.classList.remove("show");
            }
        });
    </script>

</div>
