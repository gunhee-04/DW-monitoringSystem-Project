<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>D-Vision | 실시간 관제</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; }
        .dashboard-card { background: #1e1e1e; border-radius: 12px; border: 1px solid #333; }
        .lv-normal { color: #22c55e; font-weight: bold; }
        .lv-warning { color: #f59e0b; font-weight: bold; }
        .lv-alert { color: #ef4444; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .table { color: white !important; }
    </style>
</head>
<body>
<div class="container py-5">
    <h2 class="mb-4">🛡️ D-Vision 실시간 모니터링</h2>

    <div class="dashboard-card p-4">
        <table class="table table-dark table-striped">
            <thead>
            <tr>
                <th>ID</th><th>발생 시간</th><th>상황 메시지</th><th>카메라</th><th>위험 등급</th><th>체류 시간</th><th>인원</th><th>상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${eventList}">
                <td th:text="${event.id}"></td>
                <td th:text="${event.getFormattedEventTime()}"></td>
                <td th:text="${event.message}" class="text-info small"></td>
                <td th:text="'Cam ' + ${event.cameraId}"></td>
                <td>
                        <span th:text="${event.eventLevel}"
                              th:class="${event.eventLevel.name() == 'ALERT'} ? 'lv-alert' : (${event.eventLevel.name() == 'WARNING'} ? 'lv-warning' : 'lv-normal')">
                        </span>
                </td>
                <td th:text="${(event.stayDurationSec != null ? event.stayDurationSec : 0) + '초'}">0초</td>
                <td th:text="${(event.detectedCount != null ? event.detectedCount : 0) + '명'}">0명</td>
                <td th:text="${event.intrusionNow == 1} ? '침입 중' : '-'" th:classappend="${event.intrusionNow == 1} ? 'text-danger fw-bold' : ''"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const eventSource = new EventSource('/api/sse/connect');
    eventSource.addEventListener('newDetection', function(event) {
        const data = JSON.parse(event.data);
        const tableBody = document.querySelector('tbody');
        const newRow = document.createElement('tr');
        const levelClass = data.eventLevel === 'ALERT' ? 'lv-alert' : (data.eventLevel === 'WARNING' ? 'lv-warning' : 'lv-normal');

        newRow.innerHTML = `
            <td>${data.id}</td>
            <td>${new Date().toLocaleString()}</td>
            <td class="text-info small">${data.message}</td>
            <td>Cam ${data.cameraId}</td>
            <td><span class="${levelClass}">${data.eventLevel}</span></td>
            <td>${data.stayDurationSec ?? 0}초</td>
            <td>${data.detectedCount ?? 0}명</td>
            <td class="${data.intrusionNow === 1 ? 'text-danger fw-bold' : ''}">${data.intrusionNow === 1 ? '침입 중' : '-'}</td>
        `;
        tableBody.prepend(newRow);
    });
</script>
</body>
</html>
