<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>D-Vision | 실시간 관제</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f111a; color: #e0e0e0; font-family: 'Pretendard', sans-serif; }
        .dashboard-card { background: #1a1d29; border-radius: 15px; border: 1px solid #2d3245; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .table { --bs-table-bg: transparent; color: #d1d1d1 !important; vertical-align: middle; }

        /* 등급별 애니메이션 */
        .badge-alert { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .new-row-highlight { animation: highlight 2s ease-out; }
        @keyframes highlight {
            from { background-color: rgba(255, 255, 255, 0.1); }
            to { background-color: transparent; }
        }
    </style>
</head>
<body>
<div class="container-fluid py-4 px-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-shield-lock-fill text-primary me-2"></i>D-Vision 실시간 관제 센터</h2>
        <div id="connection-status" class="badge bg-success">연결됨</div>
    </div>

    <div class="dashboard-card p-0 overflow-hidden">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
            <tr>
                <th class="ps-4">시간</th>
                <th>카메라</th>
                <th>이벤트</th>
                <th>위험 등급</th>
                <th>상황 메시지</th>
                <th>인원</th>
                <th class="pe-4 text-center">상태</th>
            </tr>
            </thead>
            <tbody id="event-list-body">
            <tr th:each="event : ${eventList}" th:classappend="${event.eventLevel.name() == 'ALERT' ? 'table-danger-subtle' : ''}">
                <td class="ps-4" th:text="${event.getFormattedEventTime()}"></td>
                <td th:text="'#0' + ${event.cameraId}"></td>
                <td><span class="badge bg-secondary" th:text="${event.eventType}"></span></td>
                <td>
                    <span class="fw-bold"
                          th:style="'color:' + (${event.eventLevel.name() == 'ALERT' ? '#FF4D4F' : (event.eventLevel.name() == 'WARNING' ? '#FAAD14' : '#52C41A')})">
                        <i th:class="${event.eventLevel.name() == 'ALERT' ? 'bi bi-exclamation-triangle-fill' : 'bi bi-info-circle-fill'}"></i>
                        [[${event.eventLevel}]]
                    </span>
                </td>
                <td class="text-light" th:text="${event.message}"></td>
                <td th:text="${event.detectedCount + '명'}"></td>
                <td class="pe-4 text-center">
                    <span th:if="${event.intrusionNow == 1}" class="badge bg-danger">침입중</span>
                    <span th:unless="${event.intrusionNow == 1}" class="text-muted small">-</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
    const eventSource = new EventSource('/api/sse/connect');
    const tbody = document.getElementById('event-list-body');
    const alertSound = document.getElementById('alert-sound');

    // 연결 상태 관리
    eventSource.onopen = () => document.getElementById('connection-status').innerText = "실시간 연결중";
    eventSource.onerror = () => document.getElementById('connection-status').className = "badge bg-danger", document.getElementById('connection-status').innerText = "연결 끊김";

    eventSource.addEventListener('newDetection', function(event) {
        const data = JSON.parse(event.data);
        console.log("새 데이터:", data);

        // 1. 위험도가 ALERT이면 소리 재생
        if(data.eventLevel === 'ALERT') {
            alertSound.play().catch(e => console.log("자동재생 차단됨"));
        }

        // 2. 새로운 행 생성 (DTO 데이터 100% 활용)
        const newRow = document.createElement('tr');
        newRow.className = 'new-row-highlight';
        if(data.eventLevel === 'ALERT') newRow.style.backgroundColor = 'rgba(255, 77, 79, 0.05)';

        newRow.innerHTML = `
            <td class="ps-4">${data.eventTime}</td>
            <td>#0${data.cameraId}</td>
            <td><span class="badge bg-secondary">${data.eventType}</span></td>
            <td>
                <span style="color: ${data.levelColor}; font-weight: bold;">
                    <i class="bi bi-${data.iconName}"></i> ${data.eventLevel}
                </span>
            </td>
            <td class="text-light">${data.message}</td>
            <td>${data.detectedCount}명</td>
            <td class="pe-4 text-center">
                ${data.intrusionNow === 1 ? '<span class="badge bg-danger badge-alert">침입중</span>' : '<span class="text-muted small">-</span>'}
            </td>
        `;

        // 3. 최상단에 추가 및 애니메이션 효과
        tbody.prepend(newRow);

        // 4. 행이 너무 많아지면 오래된 건 삭제 (성능 관리)
        if(tbody.children.length > 50) tbody.lastElementChild.remove();
    });
</script>
</body>
</html>
