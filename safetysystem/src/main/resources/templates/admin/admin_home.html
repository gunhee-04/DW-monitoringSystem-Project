<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin_home.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header('관리자 페이지')}"></div>

<div class="container">
    <section class="admin-home-hero panel">
        <div class="admin-home-hero-text">
            <p class="admin-home-subtitle">ADMIN DASHBOARD</p>
            <h1 class="admin-home-title">관리 기능 바로가기</h1>
            <p class="admin-home-desc">
                회원, 카메라, 위험구역 정보를 한 곳에서 관리할 수 있습니다.
            </p>
        </div>
    </section>

    <section class="admin-menu-grid">
        <!-- 1. 회원관리 -->
        <a th:href="@{/member/list}" class="admin-menu-card panel">
            <div class="admin-menu-icon">👤</div>
            <div class="admin-menu-content">
                <h2>회원관리</h2>
                <p>회원 조회, 권한 확인, 계정 관리</p>
            </div>
            <div class="admin-menu-arrow">→</div>
        </a>

        <!-- 2. 카메라 등록/수정 -->
        <a th:href="@{/admin/camera/list}" class="admin-menu-card panel">
            <div class="admin-menu-icon">📷</div>
            <div class="admin-menu-content">
                <h2>카메라 등록 / 수정</h2>
                <p>카메라 목록 조회, 신규 등록, 정보 수정</p>
            </div>
            <div class="admin-menu-arrow">→</div>
        </a>

        <!-- 3. 위험구역 등록/수정 -->
        <a th:href="@{/admin/camera/list}" class="admin-menu-card panel">
            <div class="admin-menu-icon">⚠️</div>
            <div class="admin-menu-content">
                <h2>위험구역 등록 / 수정</h2>
                <p>카메라 선택 후 위험구역을 등록하고 수정합니다.</p>
            </div>
            <div class="admin-menu-arrow">→</div>
        </a>
    </section>
</div>
</body>
</html>
