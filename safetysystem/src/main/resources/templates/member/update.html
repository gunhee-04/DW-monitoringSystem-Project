<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 수정</title>

    <div th:replace="fragments/header :: header('회원 수정')"></div>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <script th:src="@{/js/theme.js}"></script>
</head>
<body>

    <div style="width: 800px; margin: 50px auto;">
        <h2>회원 수정</h2>

        <div th:if="${errorMsg}" style="color:red; margin-bottom:15px;" th:text="${errorMsg}"></div>

        <form th:action="@{|/member/${member.id}/edit|}" method="post">
            <table style="width:100%; border-collapse: collapse;">
                <tr style="border-bottom:1px solid #ccc;">
                    <th style="padding:10px; width:180px;">이름</th>
                    <td style="padding:10px;">
                        <input type="text" name="name" th:value="${member.name}" style="width:100%;" required>
                    </td>
                </tr>

                <tr style="border-bottom:1px solid #ccc;">
                    <th style="padding:10px;">이메일</th>
                    <td style="padding:10px;">
                        <input type="email" name="email" th:value="${member.email}" style="width:100%;" required>
                    </td>
                </tr>

                <tr style="border-bottom:1px solid #ccc;">
                    <th style="padding:10px;">비밀번호</th>
                    <td style="padding:10px;">
                        <input type="password" name="password" placeholder="변경할 경우만 입력" style="width:100%;">
                    </td>
                </tr>

                <tr style="border-bottom:1px solid #ccc;">
                    <th style="padding:10px;">연락처</th>
                    <td style="padding:10px;">
                        <input type="text" name="phone" th:value="${member.phone}" style="width:100%;" required>
                    </td>
                </tr>

                <tr style="border-bottom:1px solid #ccc;">
                    <th style="padding:10px;">주소</th>
                    <td style="padding:10px;">
                        <input type="text" name="address" th:value="${member.address}" style="width:100%;" required>
                    </td>
                </tr>

                <tr style="border-bottom:1px solid #ccc;">
                    <th style="padding:10px;">권한</th>
                    <td style="padding:10px;">
                        <select name="role" style="width:100%;">
                            <option value="USER" th:selected="${member.role != null and member.role.name() == 'USER'}">USER</option>
                            <option value="ADMIN" th:selected="${member.role != null and member.role.name() == 'ADMIN'}">ADMIN</option>
                        </select>
                    </td>
                </tr>

                <tr style="border-bottom:1px solid #ccc;">
                    <th style="padding:10px;">상태</th>
                    <td style="padding:10px;">
                        <select name="status" style="width:100%;">
                            <option value="PENDING" th:selected="${member.status == 'PENDING'}">PENDING</option>
                            <option value="ACTIVE" th:selected="${member.status == 'ACTIVE'}">ACTIVE</option>
                            <option value="WITHDRAWN" th:selected="${member.status == 'WITHDRAWN'}">WITHDRAWN</option>
                        </select>
                    </td>
                </tr>

                <tr style="border-bottom:1px solid #ccc;">
                    <th style="padding:10px;">가입일</th>
                    <td style="padding:10px;"
                        th:text="${member.createdAt != null ? #temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
                </tr>

                <tr style="border-bottom:1px solid #ccc;">
                    <th style="padding:10px;">승인일</th>
                    <td style="padding:10px;"
                        th:text="${member.approvedAt != null ? #temporals.format(member.approvedAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
                </tr>

                <tr>
                    <th style="padding:10px;">탈퇴일</th>
                    <td style="padding:10px;"
                        th:text="${member.withdrawnAt != null ? #temporals.format(member.withdrawnAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
                </tr>
            </table>

            <br>

            <div style="text-align:right;">
                <button type="submit">수정 완료</button>
                <button type="button" onclick="location.href='/member/list'">목록</button>
            </div>
        </form>
    </div>

</body>
</html>
