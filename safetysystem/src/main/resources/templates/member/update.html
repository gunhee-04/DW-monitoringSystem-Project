<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 수정</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">
    <script th:src="@{/js/theme.js}"></script>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>

<div th:replace="fragments/header :: header('회원 수정')"></div>

    <div class="member-edit-page">
        <div class="member-edit-wrap">
            <h2 class="member-edit-title">회원 수정</h2>

            <div th:if="${errorMsg}" class="member-edit-error" th:text="${errorMsg}"></div>

            <form th:action="@{|/member/${member.id}/edit|}" method="post" class="member-edit-form" id="memberEditForm">
                <table class="member-edit-table">
                    <tbody>
                    <tr>
                        <th>이름</th>
                        <td>
                            <input type="text" name="name" th:value="${member.name}" class="member-edit-input" readonly>
                        </td>
                    </tr>

                    <tr>
                        <th>이메일</th>
                        <td>
                            <input type="email" name="email" th:value="${member.email}" class="member-edit-input" readonly>
                        </td>
                    </tr>

                    <tr>
                        <th>비밀번호</th>
                        <td>
                            <input type="password" name="password" class="member-edit-input" readonly>
                        </td>
                    </tr>

                    <tr>
                        <th>연락처</th>
                        <td>
                            <input type="text" name="phone" th:value="${member.phone}" class="member-edit-input" required>
                        </td>
                    </tr>

                    <tr>
                        <th>우편번호</th>
                        <td>
                            <div class="member-edit-postcode-row">
                                <input type="text" id="postcode" name="postcode"
                                       th:value="${member.postcode}" class="member-edit-input" readonly required>
                                <button type="button" class="member-edit-search-btn" onclick="execDaumPostcode()">
                                    주소 검색
                                </button>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <th>기본주소</th>
                        <td>
                            <input type="text" id="address" name="address"
                                   th:value="${member.address}" class="member-edit-input" readonly required>
                        </td>
                    </tr>

                    <tr>
                        <th>상세주소</th>
                        <td>
                            <input type="text" id="detailAddress" name="detailAddress"
                                   th:value="${member.detailAddress}" class="member-edit-input">
                        </td>
                    </tr>

                    <tr>
                        <th>권한</th>
                        <td>
                            <select name="role" class="member-edit-select">
                                <option value="USER" th:selected="${member.role != null and member.role.name() == 'USER'}">USER</option>
                                <option value="ADMIN" th:selected="${member.role != null and member.role.name() == 'ADMIN'}">ADMIN</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <th>상태</th>
                        <td>
                            <select name="status" class="member-edit-select">
                                <option value="ACTIVE" th:selected="${member.status == 'ACTIVE'}">ACTIVE</option>
                                <option value="WITHDRAWN" th:selected="${member.status == 'WITHDRAWN'}">WITHDRAWN</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <th>가입일</th>
                        <td class="member-edit-text"
                            th:text="${member.createdAt != null ? #temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm') : ''}">
                        </td>
                    </tr>

                    <tr>
                        <th>승인일</th>
                        <td class="member-edit-text"
                            th:text="${member.approvedAt != null ? #temporals.format(member.approvedAt, 'yyyy-MM-dd HH:mm') : ''}">
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="member-edit-btn-area">
                    <button type="button" class="member-edit-submit-btn" onclick="confirmMemberEdit()">완료</button>
                    <button type="button" class="member-edit-list-btn" onclick="location.href='/member/list'">목록</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 공용 확인 모달 -->
    <div id="memberConfirmModal" class="member-confirm-modal" aria-hidden="true">
        <div class="member-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="memberConfirmTitle">
            <button type="button" class="member-confirm-close" onclick="closeMemberConfirmModal()">×</button>

            <div class="member-confirm-icon">!</div>

            <h3 id="memberConfirmTitle" class="member-confirm-title">확인</h3>
            <p id="memberConfirmMessage" class="member-confirm-message">회원 정보를 수정하시겠습니까?</p>

            <div class="member-confirm-btn-area">
                <button type="button" class="member-confirm-cancel-btn" onclick="closeMemberConfirmModal()">취소</button>
                <button type="button" id="memberConfirmOkBtn" class="member-confirm-ok-btn">확인</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    let addr = "";
                    let extraAddr = "";

                    if (data.userSelectedType === 'R') {
                        addr = data.roadAddress;
                    } else {
                        addr = data.jibunAddress;
                    }

                    if (data.userSelectedType === 'R') {
                        if (data.bname !== '' && /[동|로|가]$/g.test(data.bname)) {
                            extraAddr += data.bname;
                        }
                        if (data.buildingName !== '' && data.apartment === 'Y') {
                            extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                        }
                        if (extraAddr !== '') {
                            extraAddr = ' (' + extraAddr + ')';
                        }
                    }

                    document.getElementById("postcode").value = data.zonecode;
                    document.getElementById("address").value = addr + extraAddr;
                    document.getElementById("detailAddress").focus();
                }
            }).open();
        }

        const memberConfirmModal = document.getElementById("memberConfirmModal");
        const memberConfirmTitle = document.getElementById("memberConfirmTitle");
        const memberConfirmMessage = document.getElementById("memberConfirmMessage");
        const memberConfirmOkBtn = document.getElementById("memberConfirmOkBtn");
        const memberEditForm = document.getElementById("memberEditForm");

        let memberConfirmCallback = null;

        function openMemberConfirmModal(title, message, callback) {
            memberConfirmTitle.textContent = title;
            memberConfirmMessage.textContent = message;
            memberConfirmCallback = callback;

            memberConfirmModal.classList.add("show");
            memberConfirmModal.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
        }

        function closeMemberConfirmModal() {
            memberConfirmModal.classList.remove("show");
            memberConfirmModal.setAttribute("aria-hidden", "true");
            document.body.style.overflow = "";
            memberConfirmCallback = null;
        }

        memberConfirmOkBtn.addEventListener("click", function() {
            if (typeof memberConfirmCallback === "function") {
                memberConfirmCallback();
            }
            closeMemberConfirmModal();
        });

        memberConfirmModal.addEventListener("click", function(e) {
            if (e.target === memberConfirmModal) {
                closeMemberConfirmModal();
            }
        });

        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape" && memberConfirmModal.classList.contains("show")) {
                closeMemberConfirmModal();
            }
        });

        function confirmMemberEdit() {
            openMemberConfirmModal(
                "회원 정보 수정",
                "회원 정보를 수정하시겠습니까?",
                function() {
                    memberEditForm.submit();
                }
            );
        }
    </script>

</body>
</html>
