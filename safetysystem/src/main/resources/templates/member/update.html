<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 수정</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">
    <script th:src="@{/js/theme.js}"></script>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>

    <div th:replace="fragments/header :: header('회원 수정')"></div>

    <div class="member-edit-page">
        <div class="member-edit-wrap">
            <h2 class="member-edit-title">회원 수정</h2>

            <div th:if="${errorMsg}" class="member-edit-error" th:text="${errorMsg}"></div>

            <form th:action="@{|/member/${member.id}/edit|}" method="post" class="member-edit-form">
                <table class="member-edit-table">
                    <tbody>
                    <tr>
                        <th>이름</th>
                        <td>
                            <input type="text" name="name" th:value="${member.name}" class="member-edit-input" required>
                        </td>
                    </tr>

                    <tr>
                        <th>이메일</th>
                        <td>
                            <input type="email" name="email" th:value="${member.email}" class="member-edit-input" required>
                        </td>
                    </tr>

                    <tr>
                        <th>비밀번호</th>
                        <td>
                            <input type="password" name="password" placeholder="변경할 경우만 입력" class="member-edit-input">
                        </td>
                    </tr>

                    <tr>
                        <th>연락처</th>
                        <td>
                            <input type="text" name="phone" th:value="${member.phone}" class="member-edit-input" required>
                        </td>
                    </tr>

                    <tr>
                        <th>우편번호</th>
                        <td>
                            <div class="member-edit-postcode-row">
                                <input type="text" id="postcode" name="postcode"
                                       th:value="${member.postcode}" class="member-edit-input" readonly required>
                                <button type="button" class="member-edit-search-btn" onclick="execDaumPostcode()">
                                    주소 검색
                                </button>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <th>기본주소</th>
                        <td>
                            <input type="text" id="address" name="address"
                                   th:value="${member.address}" class="member-edit-input" readonly required>
                        </td>
                    </tr>

                    <tr>
                        <th>상세주소</th>
                        <td>
                            <input type="text" id="detailAddress" name="detailAddress"
                                   th:value="${member.detailAddress}" class="member-edit-input">
                        </td>
                    </tr>

                    <tr>
                        <th>권한</th>
                        <td>
                            <select name="role" class="member-edit-select">
                                <option value="USER" th:selected="${member.role != null and member.role.name() == 'USER'}">USER</option>
                                <option value="ADMIN" th:selected="${member.role != null and member.role.name() == 'ADMIN'}">ADMIN</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <th>상태</th>
                        <td>
                            <select name="status" class="member-edit-select">
                                <option value="PENDING" th:selected="${member.status == 'PENDING'}">PENDING</option>
                                <option value="ACTIVE" th:selected="${member.status == 'ACTIVE'}">ACTIVE</option>
                                <option value="REJECTED" th:selected="${member.status == 'REJECTED'}">REJECTED</option>
                                <option value="WITHDRAWN" th:selected="${member.status == 'WITHDRAWN'}">WITHDRAWN</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <th>가입일</th>
                        <td class="member-edit-text"
                            th:text="${member.createdAt != null ? #temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm') : ''}">
                        </td>
                    </tr>

                    <tr>
                        <th>승인일</th>
                        <td class="member-edit-text"
                            th:text="${member.approvedAt != null ? #temporals.format(member.approvedAt, 'yyyy-MM-dd HH:mm') : ''}">
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="member-edit-btn-area">
                    <button type="submit" class="member-edit-submit-btn">완료</button>
                    <button type="button" class="member-edit-list-btn" onclick="location.href='/member/list'">목록</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    let addr = "";
                    let extraAddr = "";

                    if (data.userSelectedType === 'R') {
                        addr = data.roadAddress;
                    } else {
                        addr = data.jibunAddress;
                    }

                    if (data.userSelectedType === 'R') {
                        if (data.bname !== '' && /[동|로|가]$/g.test(data.bname)) {
                            extraAddr += data.bname;
                        }
                        if (data.buildingName !== '' && data.apartment === 'Y') {
                            extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                        }
                        if (extraAddr !== '') {
                            extraAddr = ' (' + extraAddr + ')';
                        }
                    }

                    document.getElementById("postcode").value = data.zonecode;
                    document.getElementById("address").value = addr + extraAddr;
                    document.getElementById("detailAddress").focus();
                }
            }).open();
        }
    </script>

</body>
</html>
