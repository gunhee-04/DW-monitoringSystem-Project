<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 등록</title>
</head>
<body>

<div style="width: 800px; margin: 50px auto;">
    <h2>회원 등록</h2>

    <div th:if="${errorMsg}" style="color:red; margin-bottom:15px;" th:text="${errorMsg}"></div>

    <form th:action="@{/member/create}" method="post">
        <table style="width:100%; border-collapse: collapse;">
            <tr style="border-bottom:1px solid #ccc;">
                <th style="padding:10px; width:180px;">이름</th>
                <td style="padding:10px;">
                    <input type="text" name="name" style="width:100%;" required>
                </td>
            </tr>
            <tr style="border-bottom:1px solid #ccc;">
                <th style="padding:10px;">이메일</th>
                <td style="padding:10px;">
                    <input type="email" name="email" style="width:100%;" required>
                </td>
            </tr>
            <tr style="border-bottom:1px solid #ccc;">
                <th style="padding:10px;">비밀번호</th>
                <td style="padding:10px;">
                    <input type="password" name="password" style="width:100%;" required>
                </td>
            </tr>
            <tr style="border-bottom:1px solid #ccc;">
                <th style="padding:10px;">연락처</th>
                <td style="padding:10px;">
                    <input type="text" name="phone" style="width:100%;" required>
                </td>
            </tr>
            <tr>
                <th style="padding:10px;">주소</th>
                <td style="padding:10px;">
                    <input type="text" name="address" style="width:100%;" required>
                </td>
            </tr>
        </table>

        <br>

        <div style="text-align:right;">
            <button type="submit">등록</button>
            <button type="button" onclick="location.href='/member/list'">목록</button>
        </div>
    </form>
</div>

</body>
</html>
