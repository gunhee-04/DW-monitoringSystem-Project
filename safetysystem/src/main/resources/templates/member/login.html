<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>

    <div th:replace="fragments/header :: header('로그인')"></div>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">

    <script th:src="@{/js/theme.js}"></script>

</head>
<body>

    <!-- 본문 -->
    <div class="login-page">
        <div class="login-wrap">

            <!-- 중앙 제목 -->
            <div class="login-title">
                로그인
            </div>

            <!-- 로그인 박스 -->
            <div class="login-panel">

                <form th:action="@{/member/loginProc}" method="post">

                    <!-- 아이디 / 비밀번호 입력 -->
                    <div class="login-input-group">
                        <input
                                type="text"
                                name="email"
                                placeholder="아이디"
                        >

                        <div class="login-input-divider"></div>

                        <input
                                type="password"
                                name="password"
                                placeholder="비밀번호"
                        >
                    </div>

                    <!-- 로그인 버튼 -->
                    <button type="submit" class="login-btn">
                        로그인
                    </button>

                    <!-- 구분선 -->
                    <div class="login-divider">
                        계정이 없다면
                    </div>

                    <!-- 회원가입 버튼 -->
                    <button
                            type="button"
                            class="signup-btn"
                            onclick="location.href='/member/create'"
                    >
                        회원가입
                    </button>

                </form>
            </div>

            <!-- 하단 링크 -->
            <div class="login-links">
                <a href="#">비밀번호 찾기</a>
                <span>|</span>
                <a href="#">아이디 찾기</a>
                <span>|</span>
                <a href="/member/create">회원가입</a>
            </div>

            <!-- 로그인 실패 메시지 -->
            <div th:if="${param.error}" class="login-error">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </div>

            <!-- 로그아웃 메시지 -->
            <div th:if="${param.logout}" class="login-logout">
                로그아웃되었습니다.
            </div>

        </div>
    </div>

</body>
</html>
