<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">

    <script th:src="@{/js/theme.js}"></script>

</head>
<body>
    <div th:replace="fragments/header :: header('로그인')"></div>

    <!-- 본문 -->
    <div class="login-page">
        <div class="login-wrap">

            <!-- 중앙 제목 -->
            <div class="login-title">
                로그인
            </div>

            <!-- 로그인 박스 -->
            <div class="login-panel">

                <!-- 로그인 메시지 -->
                <div th:if="${param.error != null and param.error[0] == 'login'}" class="login-error">
                    아이디 또는 비밀번호를 확인해주세요.
                </div>

                <div th:if="${param.error != null and param.error[0] == 'pending'}" class="login-error">
                    승인 대기 중인 계정입니다.
                </div>

                <!-- 로그인 폼 -->
                <form th:action="@{/member/loginProc}" method="post" onsubmit="return validateLogin()">

                    <div class="login-input-group">
                        <input type="text" name="email" placeholder="아이디">
                        <div class="login-input-divider"></div>
                        <input type="password" name="password" placeholder="비밀번호">
                    </div>

                    <button type="submit" class="login-btn">
                        로그인
                    </button>

                    <div class="login-divider">
                        계정이 없다면
                    </div>

                    <button type="button" class="signup-btn"
                            onclick="location.href='/member/create'">
                        회원가입
                    </button>

                </form>
            </div>



        </div>
    </div>

    <script>
        function validateLogin() {
            const email = document.querySelector('input[name="email"]').value.trim();
            const password = document.querySelector('input[name="password"]').value.trim();

            if (!email || !password) {
                alert("아이디와 비밀번호를 입력해주세요.");
                return false;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("아이디는 이메일 형식으로 입력해주세요.");
                return false;
            }

            return true;
        }
    </script>

</body>
</html>
