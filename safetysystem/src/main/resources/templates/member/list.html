<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 목록</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>

    <div th:replace="fragments/header :: header('회원 목록')"></div>

    <div class="member-list-page">
        <div class="member-list-wrap">

            <h2 class="member-list-title">회원 목록</h2>

            <div class="member-list-top">
                <button type="button" class="member-create-btn" onclick="location.href='/member/create'">
                    회원 등록
                </button>
            </div>

            <!-- 가입 대기 회원 -->
            <section class="member-section">
                <h3 class="member-section-title">가입 대기 회원</h3>

                <div class="member-table-box">
                    <table class="member-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>이름</th>
                            <th>이메일</th>
                            <th>연락처</th>
                            <th>주소</th>
                            <th>권한</th>
                            <th>상태</th>
                            <th>가입일</th>
                            <th class="member-manage-col">관리</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="member : ${memberList.content}"
                            th:if="${member.status.name() == 'PENDING'}">
                            <td th:text="${member.id}"></td>
                            <td th:text="${member.name}"></td>
                            <td th:text="${member.email}"></td>
                            <td th:text="${member.phone}"></td>
                            <td th:text="${member.address}"></td>
                            <td th:text="${member.role}"></td>
                            <td th:text="${member.status}"></td>
                            <td th:text="${member.createdAt != null ? #temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
                            <td class="member-manage-col">
                                <div class="member-action-group">
                                    <button type="button" class="member-action-btn approve-btn"
                                            th:onclick="|confirmApprove(${member.id})|">
                                        승인
                                    </button>
                                    <button type="button" class="member-action-btn reject-btn"
                                            th:onclick="|openRejectModal(${member.id})|">
                                        반려
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(memberList.content.?[status.name() == 'PENDING'])}">
                            <td colspan="9" class="member-empty">가입 대기 회원이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 승인 회원 -->
            <section class="member-section">
                <h3 class="member-section-title">승인 회원</h3>

                <div class="member-table-box">
                    <table class="member-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>이름</th>
                            <th>이메일</th>
                            <th>연락처</th>
                            <th>주소</th>
                            <th>권한</th>
                            <th>상태</th>
                            <th>가입일</th>
                            <th class="member-manage-col">관리</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="member : ${memberList.content}"
                            th:if="${member.status.name() == 'ACTIVE'}">
                            <td th:text="${member.id}"></td>
                            <td th:text="${member.name}"></td>
                            <td th:text="${member.email}"></td>
                            <td th:text="${member.phone}"></td>
                            <td th:text="${member.address}"></td>
                            <td th:text="${member.role}"></td>
                            <td th:text="${member.status}"></td>
                            <td th:text="${member.createdAt != null ? #temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
                            <td class="member-manage-col">
                                <div class="member-action-group">
                                    <button type="button" class="member-action-btn edit-btn"
                                            th:onclick="|location.href='/member/${member.id}/edit'|">
                                        수정
                                    </button>
                                    <button type="button" class="member-action-btn withdraw-btn"
                                            th:onclick="|confirmWithdraw(${member.id})|">
                                        탈퇴
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(memberList.content.?[status.name() == 'ACTIVE'])}">
                            <td colspan="9" class="member-empty">승인 회원이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 탈퇴 회원 -->
            <section class="member-section">
                <h3 class="member-section-title">탈퇴 회원</h3>

                <div class="member-table-box">
                    <table class="member-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>이름</th>
                            <th>이메일</th>
                            <th>연락처</th>
                            <th>주소</th>
                            <th>권한</th>
                            <th>상태</th>
                            <th>탈퇴일</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="member : ${memberList.content}"
                            th:if="${member.status.name() == 'WITHDRAWN'}">
                            <td th:text="${member.id}"></td>
                            <td th:text="${member.name}"></td>
                            <td th:text="${member.email}"></td>
                            <td th:text="${member.phone}"></td>
                            <td th:text="${member.address}"></td>
                            <td th:text="${member.role}"></td>
                            <td th:text="${member.status}"></td>
                            <td th:text="${member.withdrawnAt != null ? #temporals.format(member.withdrawnAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(memberList.content.?[status.name() == 'WITHDRAWN'])}">
                            <td colspan="8" class="member-empty">탈퇴 회원이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 반려 회원 -->
            <section class="member-section">
                <h3 class="member-section-title">반려 회원</h3>

                <div class="member-table-box">
                    <table class="member-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>이름</th>
                            <th>이메일</th>
                            <th>연락처</th>
                            <th>주소</th>
                            <th>권한</th>
                            <th>상태</th>
                            <th>반려일시</th>
                            <th class="member-reason-col">반려사유</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="member : ${memberList.content}"
                            th:if="${member.status.name() == 'REJECTED'}">
                            <td th:text="${member.id}"></td>
                            <td th:text="${member.name}"></td>
                            <td th:text="${member.email}"></td>
                            <td th:text="${member.phone}"></td>
                            <td th:text="${member.address}"></td>
                            <td th:text="${member.role}"></td>
                            <td th:text="${member.status}"></td>
                            <td th:text="${member.rejectedAt != null ? #temporals.format(member.rejectedAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
                            <td class="member-reason-col">
                                <button type="button"
                                        class="member-action-btn detail-btn"
                                        th:attr="data-reason=${member.rejectReason}"
                                        onclick="showRejectReason(this)">
                                    상세보기
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(memberList.content.?[status.name() == 'REJECTED'])}">
                            <td colspan="9" class="member-empty">반려 회원이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </div>

    <!-- 공용 확인 모달 -->
    <div id="memberConfirmModal" class="member-confirm-modal" aria-hidden="true">
        <div class="member-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="memberConfirmTitle">
            <button type="button" class="member-confirm-close" onclick="closeMemberConfirmModal()">×</button>

            <div class="member-confirm-icon">!</div>

            <h3 id="memberConfirmTitle" class="member-confirm-title">확인</h3>
            <p id="memberConfirmMessage" class="member-confirm-message">정말 진행하시겠습니까?</p>

            <div class="member-confirm-btn-area">
                <button type="button" class="member-confirm-cancel-btn" onclick="closeMemberConfirmModal()">취소</button>
                <button type="button" id="memberConfirmOkBtn" class="member-confirm-ok-btn">확인</button>
            </div>
        </div>
    </div>

    <!-- 반려 입력 모달 -->
    <div id="memberRejectModal" class="member-reject-modal" aria-hidden="true">
        <div class="member-reject-dialog" role="dialog" aria-modal="true" aria-labelledby="memberRejectTitle">
            <button type="button" class="member-reject-close" onclick="closeRejectModal()">×</button>

            <h3 id="memberRejectTitle" class="member-reject-title">회원 반려</h3>
            <p class="member-reject-desc">반려 사유를 입력해주세요.</p>

            <textarea id="memberRejectReason"
                      class="member-reject-textarea"
                      placeholder="예: 제출 정보가 누락되어 가입 승인이 보류되었습니다."></textarea>

            <div class="member-reject-btn-area">
                <button type="button" class="member-reject-cancel-btn" onclick="closeRejectModal()">취소</button>
                <button type="button" class="member-reject-submit-btn" onclick="submitReject()">반려</button>
            </div>
        </div>
    </div>

    <!-- 반려사유 조회 모달 -->
    <div id="rejectReasonModal" class="custom-modal">
        <div class="custom-modal-content">
            <div class="custom-modal-header">
                <span>반려 사유</span>
                <button type="button" class="custom-modal-close" onclick="closeRejectReasonModal()">×</button>
            </div>
            <div id="rejectReasonText" class="custom-modal-body"></div>
        </div>
    </div>

    <script th:inline="javascript">
        const csrfToken = /*[[${_csrf != null ? _csrf.token : ''}]]*/ "";
        const csrfHeaderName = /*[[${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}]]*/ "X-CSRF-TOKEN";

        const memberConfirmModal = document.getElementById("memberConfirmModal");
        const memberConfirmTitle = document.getElementById("memberConfirmTitle");
        const memberConfirmMessage = document.getElementById("memberConfirmMessage");
        const memberConfirmOkBtn = document.getElementById("memberConfirmOkBtn");

        const memberRejectModal = document.getElementById("memberRejectModal");
        const memberRejectReason = document.getElementById("memberRejectReason");

        let memberConfirmCallback = null;
        let rejectTargetId = null;

        function lockScroll() {
            document.body.style.overflow = "hidden";
        }

        function unlockScroll() {
            document.body.style.overflow = "";
        }

        function buildHeaders(isJson = false) {
            const headers = {};
            if (csrfToken) {
                headers[csrfHeaderName] = csrfToken;
            }
            if (isJson) {
                headers["Content-Type"] = "application/json";
            }
            return headers;
        }

        function openMemberConfirmModal(title, message, callback) {
            memberConfirmTitle.textContent = title;
            memberConfirmMessage.textContent = message;
            memberConfirmCallback = callback;

            memberConfirmModal.classList.add("show");
            memberConfirmModal.setAttribute("aria-hidden", "false");
            lockScroll();
        }

        function closeMemberConfirmModal() {
            memberConfirmModal.classList.remove("show");
            memberConfirmModal.setAttribute("aria-hidden", "true");
            memberConfirmCallback = null;
            unlockScroll();
        }

        async function executeConfirmAction() {
            if (typeof memberConfirmCallback === "function") {
                await memberConfirmCallback();
            }
            closeMemberConfirmModal();
        }

        memberConfirmOkBtn.addEventListener("click", executeConfirmAction);

        function openRejectModal(id) {
            rejectTargetId = id;
            memberRejectReason.value = "";
            memberRejectModal.classList.add("show");
            memberRejectModal.setAttribute("aria-hidden", "false");
            lockScroll();
            setTimeout(() => memberRejectReason.focus(), 50);
        }

        function closeRejectModal() {
            memberRejectModal.classList.remove("show");
            memberRejectModal.setAttribute("aria-hidden", "true");
            memberRejectReason.value = "";
            rejectTargetId = null;
            unlockScroll();
        }

        async function approveMember(id) {
            const response = await fetch(`/api/members/${id}/approve`, {
                method: "PATCH",
                headers: buildHeaders(false)
            });

            const msg = await response.text();

            if (!response.ok) {
                alert(msg || "회원 승인 중 오류가 발생했습니다.");
                return;
            }

            location.href = "/member/list";
        }

        async function rejectMember(id, reason) {
            const response = await fetch(`/api/members/${id}/reject`, {
                method: "PATCH",
                headers: buildHeaders(true),
                body: JSON.stringify({
                    rejectReason: reason
                })
            });

            const msg = await response.text();

            if (!response.ok) {
                alert(msg || "회원 반려 처리 중 오류가 발생했습니다.");
                return;
            }

            location.href = "/member/list";
        }

        async function withdrawMember(id) {
            const response = await fetch(`/api/members/${id}`, {
                method: "DELETE",
                headers: buildHeaders(false)
            });

            const msg = await response.text();

            if (!response.ok) {
                alert(msg || "회원 탈퇴 처리 중 오류가 발생했습니다.");
                return;
            }

            location.href = "/member/list";
        }

        function confirmApprove(id) {
            openMemberConfirmModal(
                "회원 승인",
                "이 회원을 승인하시겠습니까?",
                async function() {
                    await approveMember(id);
                }
            );
        }

        function confirmWithdraw(id) {
            openMemberConfirmModal(
                "회원 탈퇴 처리",
                "탈퇴 처리 하시겠습니까?",
                async function() {
                    await withdrawMember(id);
                }
            );
        }

        async function submitReject() {
            const reason = memberRejectReason.value.trim();

            if (!reason) {
                alert("반려 사유를 입력해야 합니다.");
                memberRejectReason.focus();
                return;
            }

            try {
                await rejectMember(rejectTargetId, reason);
                closeRejectModal();
            } catch (e) {
                console.error(e);
                alert("회원 반려 처리 중 오류가 발생했습니다.");
            }
        }

        function showRejectReason(button) {
            const reason = button.getAttribute("data-reason") || "반려 사유가 없습니다.";
            document.getElementById("rejectReasonText").textContent = reason;
            document.getElementById("rejectReasonModal").style.display = "flex";
            lockScroll();
        }

        function closeRejectReasonModal() {
            document.getElementById("rejectReasonModal").style.display = "none";
            unlockScroll();
        }

        memberConfirmModal.addEventListener("click", function(e) {
            if (e.target === memberConfirmModal) {
                closeMemberConfirmModal();
            }
        });

        memberRejectModal.addEventListener("click", function(e) {
            if (e.target === memberRejectModal) {
                closeRejectModal();
            }
        });

        window.addEventListener("click", function(e) {
            const reasonModal = document.getElementById("rejectReasonModal");
            if (e.target === reasonModal) {
                closeRejectReasonModal();
            }
        });

        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") {
                if (memberConfirmModal.classList.contains("show")) {
                    closeMemberConfirmModal();
                }
                if (memberRejectModal.classList.contains("show")) {
                    closeRejectModal();
                }
                const reasonModal = document.getElementById("rejectReasonModal");
                if (reasonModal.style.display === "flex") {
                    closeRejectReasonModal();
                }
            }
        });
    </script>

</body>
</html>
