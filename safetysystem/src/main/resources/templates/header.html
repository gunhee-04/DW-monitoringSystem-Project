<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="header(title)">
    <div class="topbar">
        <div class="topbar-left">
            <a th:href="@{/}" class="logo-link">
                <img th:src="@{/images/logo-light.png}"
                     data-light="/images/logo-light.png"
                     data-dark="/images/logo-dark.png"
                     class="logo-img"
                     id="main-logo">
                <div class="logo-text" th:text="${title}">스마트 안전 관제 시스템</div>
            </a>
        </div>

        <div class="topbar-right">
            <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()">🌙 다크네이비</button>

            <div class="alert-wrapper">
                <button type="button" class="alert-btn" onclick="toggleAlertPanel()">🔔
                    <span id="alert-badge" class="alert-badge">0</span>
                </button>

                <div id="alert-panel" class="alert-panel">
                    <div class="alert-panel-title">중요 알림</div>
                    <div id="alert-list" class="alert-list">
                        <div class="alert-empty">중요 로그가 없습니다.</div>
                    </div>
                </div>
            </div>

            <div class="user-box">👤 관리자님</div>
        </div>
    </div>
</div>
</body>
</html>
